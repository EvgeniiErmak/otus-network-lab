      addresses:
      - 192.168.255.1/30
      routes:
      # обратный маршрут во все внутренние сети через centralRouter
      - to: 192.168.0.0/16
        via: 192.168.255.2
    eth2:
      addresses:
      - 192.168.50.10/24
